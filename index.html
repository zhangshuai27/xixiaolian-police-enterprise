'use strict';
const $=s=>document.querySelector(s), icon=(name)=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GUIDE='如您想咨询经济犯罪案件相关的问题，可以就近到属地派出所咨询，或到西城公安分局经济犯罪侦查支队受案中心前台咨询（联系电话63565726）。';

let records=[];try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'[]');if(Array.isArray(saved))records=saved.filter(x=>x&&typeof x.title==='string'&&typeof x.desc==='string').slice(0,30)}catch{}
const state={page:'home',tab:'risk',search:'',history:[],messages:[],chatKind:'station',faqCategory:'全部',faqQuery:'',faqId:'internal',legalMode:'home',legalMessages:[],chatInput:'',draft:{type:'普法问题',title:'',desc:'',agree:false}};
const legalHomeHTML=$('#legalContent').innerHTML;
const articles=[
{id:'internal',type:'risk',tag:'内部管理',icon:'shield',title:'企业内部风险，从这几个环节开始防范',summary:'围绕采购、付款和岗位权限，关注日常管理中的风险信号。',blocks:[['从流程里识别风险','采购审批、资金支付、费用报销等环节，应留意职责过度集中、凭证不完整、审批流于形式等管理问题。这些信号用于提示进一步核查，不能直接作为犯罪认定。'],['把关键环节管起来','企业可结合实际建立岗位分工、复核与定期检查机制，明确审批权限和记录要求，减少单一岗位对业务全过程的控制。'],['发现具体问题时','如涉及具体经济犯罪案件，请通过线下正式渠道咨询。不要把涉案材料、人员身份信息或商业秘密上传到本栏目。']]},
{id:'contract',type:'risk',tag:'合同交易',icon:'case',title:'合同签订前，先关注交易中的风险信号',summary:'了解交易对手、合同条款与履约流程中的常见管理风险。',blocks:[['签约前核实基本情况','关注交易主体、对接人员身份、授权范围和交易安排是否一致。资料不足或出现异常时，先进一步核实。'],['执行中留下完整记录','在企业制度下保存合同版本、审批记录、交付确认和结算依据，明确各环节责任。'],['违约与犯罪需要具体分析','一般违约和经济犯罪的判断涉及具体事实与证据，不能仅凭未付款或未交货作出结论。如需咨询具体案件，请线下咨询。']]},
{id:'investment',type:'risk',tag:'金融风险',icon:'shield',title:'面对高收益承诺，企业应保持审慎',summary:'把风险识别前移，关注宣传承诺、资金安排和信息透明度。',blocks:[['关注承诺与实际信息','对异常高收益、保本承诺和不透明资金安排提高警惕，不以宣传材料替代必要的核实。'],['做好内部决策与风险审查','重大资金事项应按照企业制度履行决策、复核和风险评估程序。具体事项可向有资质的专业机构咨询。']]},
{id:'case1',type:'cases',tag:'案例解读',icon:'case',title:'从采购管理情境，看企业内部防范要点',summary:'一个虚构的普法情境，帮助理解供应商审核与岗位制衡。',blocks:[['普法情境','某企业将供应商选择、采购确认与付款申请集中在同一岗位，复核环节较少。此处为产品演示编写的虚构情境，不是真实案件。'],['可以讨论的管理问题','企业如何核实供应商信息？不同岗位如何分工？付款申请和业务交付之间如何复核？这些问题可作为企业内部制度检查的切入点。'],['从情境到日常防范','可结合业务规模完善复核记录与权限管理。情境仅用于普法，不对任何人员或企业作犯罪判断。']]},
{id:'case2',type:'cases',tag:'案例解读',icon:'book',title:'从交易异常情境，看合同履约风险',summary:'通过虚构情境理解交易核实、记录保存与风险沟通。',blocks:[['普法情境','企业签约后发现对方频繁变更收款信息，交付情况与原定安排存在差异。此处为虚构演示情境，不代表真实案件。'],['管理启示','对主体和收款信息变化进行核实，按制度开展风险复核并保存业务记录。是否涉及犯罪应由有权机关结合事实依法判断。']]},
{id:'law1',type:'law',tag:'罪名知识',icon:'scale',title:'认识经济犯罪知识，从概念与边界开始',summary:'通过审核资料了解常见概念，避免把普法知识当作个案结论。',blocks:[['怎样使用法律知识栏目','正式上线后，这里将展示经审核的法条、罪名释义、适用说明和关联案例，并标明来源与更新信息。'],['一般知识与个案判断','普法资料帮助理解概念。具体事项是否符合有关条件，需要结合事实和证据依法判断。'],['演示范围','当前页面仅演示内容结构，不展示未经核验的法条文本、金额标准或量刑结论。']]}
];

function back(){if(state.history.length){const previous=state.history.pop();Object.assign(state,previous);render();$('#serviceContent').scrollTop=previous.scroll||0}else{state.page='home';render();document.body.classList.remove('mobile-service');}}

const faqs=[
{id:'internal',category:'内部管理',q:'企业内部风险如何防范？',summary:'采购、审批与付款环节，哪些地方要关注',answer:'可以从企业日常管理流程入手：明确采购、审批、付款等岗位的分工，保留业务凭证和复核记录，并定期检查关键岗位权限与异常业务。\n\n这些是一般防范思路，不能据此认定具体人员或事项是否涉嫌犯罪。',source:'internal'},
{id:'contract',category:'合同交易',q:'签订合同前，要注意哪些风险？',summary:'核实交易信息，关注履约安排',answer:'签约前可关注交易主体、人员授权、合同约定与实际安排是否一致，并按企业制度做好审批及履约记录。\n\n对异常信息应进一步核实，不能仅凭违约直接认定犯罪。',source:'contract'},
{id:'investment',category:'金融风险',q:'面对高收益承诺，企业应注意什么？',summary:'关注收益承诺和资金安排的透明度',answer:'对异常高收益、保本承诺和不透明的资金安排保持审慎；重大资金事项应按企业制度履行决策、复核和风险评估程序。',source:'investment'},
{id:'case-reading',category:'内部管理',q:'典型案例可以怎样帮助企业防范风险？',summary:'从案例中看管理环节，不直接套用个案结论',answer:'可以关注案例中的业务流程、管理缺口与防范措施，并结合企业实际检查内部制度。\n\n案例不能直接替代对具体事项的事实核查或专业判断。',source:'case1'},
{id:'contact',category:'服务指引',q:'经济犯罪案件相关问题，到哪里咨询？',summary:'查看属地派出所或西城经侦窗口指引',answer:GUIDE,guide:true},
{id:'training',category:'服务指引',q:'想请经侦讲解企业风险，在哪里提需求？',summary:'通过企业出题提交普法选题或培训需求',answer:'进入“企业出题”，选择普法问题或培训需求，填写希望了解的主题。工作人员可定期汇总共性需求，择题开展普法答疑或培训。\n\n提交需求不代表培训已预约成功，也不承诺逐条即时回复。',demand:true}
];
function faq(){return `<section class="popular-questions"><h2>大家都在问</h2><div class="faq-list">${faqs.map(f=>`<button class="faq-row" data-action="faqDetail" data-id="${f.id}"><span>${f.q}<small>${f.summary}</small></span>${icon('chevron')}</button>`).join('')}</div><button class="question-demand" data-action="leave"><span>没找到想问的？企业出题</span>${icon('arrow')}</button></section>`}
function faqDetail(){const f=faqs.find(x=>x.id===state.faqId)||faqs[0];return `<article class="content-sheet"><span class="tiny-tag">${f.category}</span><h2>${f.q}</h2><div class="source">常见咨询 · ${f.guide?'对接人员提供的渠道信息':'示例答复，待经侦审核'}</div><p style="white-space:pre-line">${esc(f.answer)}</p>${f.source?`<button class="secondary" data-action="article" data-id="${f.source}">${icon('book')} 查看关联资料</button>`:''}${f.guide?'<button class="secondary" data-action="guide">有事找谁 · 查看完整指引</button>':''}${f.demand?'<button class="secondary" data-action="training">企业出题 · 提出培训需求</button>':''}</article><button class="primary" data-action="ask" data-q="${esc(f.q)}">继续问小联</button>`}
function library(){const visible=articles.filter(a=>a.type===state.tab&&(!state.search||(a.title+a.summary+a.tag).includes(state.search)));return `<div class="page-intro"><h2>经侦知识库</h2><p>了解常见风险，让防范走在前面</p></div><label class="search">${icon('search')}<input id="knowledgeSearch" aria-label="搜索知识" placeholder="搜索风险、案例或法律知识" value="${esc(state.search)}"></label><div class="tabs" role="tablist">${[['risk','风险防范'],['cases','典型案例'],['law','法律知识']].map(([t,n])=>`<button role="tab" aria-selected="${state.tab===t}" class="${state.tab===t?'active':''}" data-action="tab" data-tab="${t}">${n}</button>`).join('')}</div><div id="libraryResults"><div class="result-count">${visible.length}篇内容示例 · 待经侦审核发布</div>${visible.map(a=>`<button class="library-card" data-action="article" data-id="${a.id}"><span class="tiny-tag">${a.tag}</span><h3>${a.title}</h3><p>${a.summary}</p><span class="meta"><span>演示资料 · 约2分钟阅读</span><span>阅读详情 →</span></span></button>`).join('')||`<div class="empty">${icon('search')}<h3>暂未找到相关内容</h3><p>试试其他关键词，或留下您希望了解的主题。</p><button class="primary" data-action="leave">企业出题</button></div>`}</div>`}
function article(){const a=articles.find(x=>x.id===state.article)||articles[0];return `<article class="content-sheet"><span class="tiny-tag">${a.tag}</span><h2>${a.title}</h2><div class="source">内容示例 · 产品演示编写 · 待经侦审核</div>${a.blocks.map(([h,t])=>`<h3>${h}</h3><p>${t}</p>`).join('')}<p class="article-foot">以上内容用于演示页面呈现方式，不能用于具体案件判断。正式上线后展示经审核的来源和更新日期。</p></article><button class="primary" data-action="ask" data-q="${a.type==='risk'&&a.id==='contract'?'签合同前要注意什么？':'企业内部风险如何防范？'}">${icon('chat')} 向小联了解相关防范知识</button>${offlineStrip()}`}
function chat(){return `<div class="chat-intro"><div class="ask-face"><img src="assets/law-assistant.png" alt="小联说法务"></div><h2>${state.chatKind==='legal'?'小联说法务':'经侦知识问答'}</h2><p>您可以问一般知识，也可以查看相关资料</p></div><div class="chat-hint">AI问答演示 · 具体案件请线下咨询</div><div class="chat-area">${state.messages.length?state.messages.map(m=>`<div class="bubble ${m.role}">${m.role==='assistant'?'<label>小联 · 示例答复</label>':''}<p>${esc(m.text)}</p>${m.source?`<button class="chat-source" data-action="article" data-id="${m.source}">${icon('book')} 查看相关内容示例</button>`:''}${m.guide?'<button class="chat-source" data-action="guide">有事找谁 · 查看线下咨询指引 →</button>':''}${m.demand?'<button class="chat-source" data-action="leave">企业出题 · 提出普法需求 →</button>':''}</div>`).join(''):`<div class="bubble assistant"><label>小联 · 示例答复</label><p>您好！您想了解哪方面的风险防范知识？可以从下面的问题开始。</p></div><div class="chat-choices"><button data-action="ask" data-q="企业内部风险如何防范？">企业内部风险如何防范？</button><button data-action="ask" data-q="签合同前要注意什么？">签合同前要注意什么？</button><button data-action="ask" data-q="经济犯罪案件到哪里咨询？">经济犯罪案件到哪里咨询？</button></div>`}</div>`}
function isCase(q){return /报案|报警|立案|受案|案情|案件|证据|我.{0,8}被|我们.{0,8}被骗|涉嫌|是否.{0,5}犯罪|构成.{0,5}罪|算不算|追回|追赃|刑事还是民事/.test(q)}
function ask(q,kind='station'){
 q=q.trim();if(!q)return;if(kind==='legal'){askLegal(q);return}
 state.chatKind='station';state.chatInput='';state.messages.push({role:'user',text:q});let m={role:'assistant',text:''};
 if(isCase(q)){m.text='具体事项需要通过正式渠道，由专业人员结合事实和证据了解。\n\n'+GUIDE+'\n\n请勿在这里提交案情或案件材料。';m.guide=true}
 else if(/培训|想听|出题/.test(q)){m.text=faqs.find(f=>f.id==='training').answer;m.demand=true}
 else if(/高收益|金融|投资/.test(q)){m.text=faqs.find(f=>f.id==='investment').answer;m.source='investment'}
 else if(/内部|职务|采购|员工|侵占/.test(q)){m.text=faqs.find(f=>f.id==='internal').answer;m.source='internal'}
 else if(/合同|交易|签约/.test(q)){m.text=faqs.find(f=>f.id==='contract').answer;m.source='contract'}
 else if(/典型案例|案例.{0,6}防范/.test(q)){m.text=faqs.find(f=>f.id==='case-reading').answer;m.source='case1'}
 else{m.text='当前演示资料暂未覆盖这个问题。您可以查看常见咨询，或通过企业出题提出希望了解的普法主题。';m.demand=true}
 state.messages.push(m);go('chat',{chatKind:'station'});requestAnimationFrame(()=>$('#serviceContent').scrollTop=$('#serviceContent').scrollHeight)
}
function askLegal(q){q=q.trim();if(!q)return;state.legalMode='chat';state.legalMessages.push({role:'user',text:q});state.legalMessages.push({role:'assistant',text:'这里是小联说法务的法律知识问答入口。当前原型未接入原有法务知识库，暂不生成个案建议。\n\n如希望了解经侦风险防范知识，可从首页右侧进入警企服务站。'});renderLegal();document.body.classList.remove('mobile-service');}
function renderLegal(){
 if(state.legalMode==='home'){$('#legalContent').innerHTML=legalHomeHTML;$('#legalContent').scrollTop=0;return}
 if(state.legalMode==='cases'){$('#legalContent').innerHTML=`<div class="page-intro"><h2>涉民企经典案例</h2><p>小联说法务原有内容入口</p></div><div class="content-sheet"><h3>企业经营中的法律问题</h3><p>正式页面沿用现有法务案例库。当前演示不连接真实案例资料。</p><p class="article-foot">此入口属于小联说法务，独立于警企服务站的经侦资料。</p></div><button class="secondary" data-action="legalBack">返回小联说法务</button>`;return}
 $('#legalContent').innerHTML=`<div class="legal-conversation"><div class="chat-intro"><h2>小联说法务</h2><p>您的专属智慧法律顾问</p></div><div class="chat-area">${state.legalMessages.map(m=>`<div class="bubble ${m.role}">${m.role==='assistant'?'<label>小联 · 演示说明</label>':''}<p>${esc(m.text)}</p></div>`).join('')}</div><button class="secondary" data-action="legalBack">返回法务首页</button></div>`;$('#legalContent').scrollTop=$('#legalContent').scrollHeight;
}
function leave(){const d=state.draft;return `<div class="page-intro"><div class="page-topline"><h2>企业出题</h2><button class="text-btn" data-action="messages">我的出题 →</button></div><p>有关风险想听经侦讲</p></div><form id="demandForm"><div class="form-block"><div class="field-label">您想提出哪类需求</div><div class="type-chips">${['普法问题','培训需求','资料建议'].map(t=>`<button type="button" data-action="demandType" data-type="${t}" class="${d.type===t?'active':''}" aria-pressed="${d.type===t}">${t}</button>`).join('')}</div></div><div class="form-block"><label class="field-label" for="demandTitle">需求主题 <small>必填</small></label><input class="form-field" id="demandTitle" placeholder="如：希望了解企业内部风险防范" maxlength="40" value="${esc(d.title)}" required><small><span id="titleCount">${d.title.length}</span>/40</small><label class="field-label" for="demandDesc" style="margin-top:17px">具体需求 <small>必填</small></label><textarea class="form-field" id="demandDesc" placeholder="请描述希望了解的知识或培训主题，请勿填写具体案情、涉案人员或证据信息。" maxlength="500" required>${esc(d.desc)}</textarea><small><span id="descCount">${d.desc.length}</span>/500</small></div><label class="checkrow"><input id="demandAgree" type="checkbox" ${d.agree?'checked':''} required><span>我已了解：留言用于普法需求收集，不作为报案或案件受理。请勿提交案情、商业秘密及敏感个人信息。</span></label><div class="form-error" id="formError" role="alert"></div><button class="primary" type="submit">提交普法需求</button><div class="soft-note">工作人员将定期汇总主题，择题开展答疑或培训，不承诺逐条即时回复。<br>当前为模拟提交，记录仅保存在本浏览器。</div></form>${offlineStrip()}`}
function messages(){return `<div class="page-intro"><h2>我的出题</h2><p>查看普法需求的提交记录</p></div>${records.length?records.map(r=>`<article class="status-card"><header><span>${esc(r.type)}</span><span class="status">已提交 · 演示</span></header><h3>${esc(r.title)}</h3><p>${esc(r.desc)}</p><footer>${esc(r.date)} · 仅本地保存，未提交至经侦</footer></article>`).join('')+`<button class="secondary" data-action="leave">继续提出普法需求</button><div class="soft-note">正式上线后，可在此查看选题及答疑结果。当前没有真实后台处理。</div>`:`<div class="empty">${icon('write')}<h3>还没有留言</h3><p>您关心的经营风险、想听的普法课，<br>都可以从这里提出。</p><button class="primary" data-action="leave">写下我的需求</button></div>`}`}
function guide(){return `<div class="page-intro"><h2>有事找谁</h2><p>这事该找谁说</p></div><section class="guide-box"><h3>经济犯罪案件相关咨询</h3><p>${GUIDE}</p><div class="contact-row"><div><small>对接人员提供的联系电话</small><strong>63565726</strong></div><button class="copy-btn" data-action="copy">复制号码</button></div><p>前往前请确认最新接待地点与时间。具体专业问题以现场咨询为准。</p></section><section class="guide-box"><h3>其他服务需求</h3><button class="guide-route" data-action="returnLegal"><span><strong>想了解一般法律知识</strong><small>返回小联说法务</small></span>${icon('chevron')}</button><button class="guide-route" data-action="training"><span><strong>想提出普法或培训主题</strong><small>前往企业出题</small></span>${icon('chevron')}</button></section><p class="soft-note">以上为服务渠道说明，不作案件性质或管辖认定。栏目不承接报案，不接收案件材料。<br><br>演示说明：电话沿用对接人员提供的信息；接待地址与时间上线前确认。</p>`}
function success(){return `<div class="success-page"><div class="success-icon">${icon('check')}</div><h2>已记录您的普法需求</h2><p>感谢您提出关心的主题。<br>正式上线后，工作人员将定期汇总，<br>通过专题答疑或培训回应共性需求。</p><div class="soft-note">模拟提交成功 · 仅保存在本浏览器<br>本次操作未向工商联或经侦发送信息</div><button class="primary" data-action="messages">查看我的出题</button><button class="secondary" data-action="home">返回服务站首页</button></div>`}

function render(){
 const pages={home,faq,faqDetail,library,article,chat,leave,messages,guide,success};
 const titles={home:'警企服务站',faq:'常见咨询',faqDetail:'常见咨询',library:'专题资料',article:'资料详情',chat:'警企服务站',leave:'企业出题',messages:'我的出题',guide:'有事找谁',success:'提交结果'};
 $('#serviceTitle').textContent=titles[state.page];$('#deviceLabel').textContent=titles[state.page];
 $('#serviceContent').innerHTML=`<div class="page">${pages[state.page]()}</div>`;
 const showComposer=['home','faq','faqDetail','library','article','chat','guide'].includes(state.page);
 $('#composer').innerHTML=showComposer?`<div class="station-composer"><form id="chatForm"><input name="q" aria-label="输入经侦知识问题" placeholder="请在这里输入问题" value="${esc(state.chatInput)}" maxlength="300" autocomplete="off" required><button class="mic-button" type="button" aria-label="经侦问答语音输入演示" data-action="voice">${icon('mic')}</button><button type="submit" class="send-plain" aria-label="发送经侦知识问题">${icon('send')}</button></form><div class="ai-foot">内容由AI生成，基于经侦校核资料 · 不承接报案</div></div>`:'';
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='enter'){state.history=[];go('home',{},false)}
 else if(a==='back')back();
 else if(a==='home'){state.history=[];go('home',{},false)}
 else if(a==='faq')go('faq',{faqQuery:'',faqCategory:'全部'});
 else if(a==='faqCategory'){state.faqCategory=b.dataset.category;render()}
 else if(a==='faqDetail')go('faqDetail',{faqId:b.dataset.id});
 else if(a==='library')go('library',{tab:b.dataset.tab||'risk',search:''});
 else if(a==='tab'){state.tab=b.dataset.tab;render()}
 else if(a==='article')go('article',{article:b.dataset.id});
 else if(a==='chat')go('chat',{chatKind:'station'});
 else if(a==='ask')ask(b.dataset.q);
 else if(a==='legalQuestion')askLegal(b.dataset.q);
 else if(a==='legalCases'){state.legalMode='cases';renderLegal()}
 else if(['leave','messages','guide'].includes(a))go(a);
 else if(a==='training'){state.draft.type='培训需求';go('leave')}
 else if(a==='returnLegal'){state.page='home';state.history=[];state.legalMode='home';render();renderLegal();document.body.classList.remove('mobile-service');}
 else if(a==='legalBack'){if(state.legalMode!=='home'){state.legalMode='home';renderLegal()}else toast('当前为小联说法务首页演示')}
 else if(a==='demandType'){state.draft.type=b.dataset.type;render()}
 else if(a==='reference')$('#referenceDialog').showModal();
 else if(a==='closeReference')$('#referenceDialog').close();
 else if(a==='closeCase')$('#caseDialog').close();
 else if(a==='caseGuide'){$('#caseDialog').close();go('guide')}
 else if(a==='voice')toast('语音输入为界面演示，暂未接入录音能力');
 else if(a==='copy'){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText('63565726').then(()=>toast('号码已复制：63565726')).catch(()=>toast('联系电话：63565726'));else toast('联系电话：63565726（可长按号码复制）')}
 else if(a==='reset'){records=[];state.messages=[];state.legalMessages=[];state.chatInput='';state.legalMode='home';state.draft={type:'普法问题',title:'',desc:'',agree:false};try{localStorage.removeItem(STORAGE)}catch{}state.history=[];renderLegal();go('home',{},false);toast('已清空本浏览器的演示记录')}
});
document.addEventListener('input',e=>{
 if(e.target.id==='knowledgeSearch'){state.search=e.target.value;const temp=document.createElement('div');temp.innerHTML=library();$('#libraryResults').innerHTML=temp.querySelector('#libraryResults').innerHTML}
 else if(e.target.id==='faqSearch'){state.faqQuery=e.target.value;const temp=document.createElement('div');temp.innerHTML=faq();$('#faqResults').innerHTML=temp.querySelector('#faqResults').innerHTML}
 else if(e.target.id==='demandTitle'){state.draft.title=e.target.value;$('#titleCount').textContent=e.target.value.length}
 else if(e.target.id==='demandDesc'){state.draft.desc=e.target.value;$('#descCount').textContent=e.target.value.length}
 else if(e.target.name==='q')state.chatInput=e.target.value;
});
document.addEventListener('change',e=>{if(e.target.id==='demandAgree')state.draft.agree=e.target.checked});
document.addEventListener('submit',e=>{
 e.preventDefault();
 if(e.target.id==='legalForm'){const i=e.target.querySelector('input');askLegal(i.value);i.value=''}
 else if(e.target.id==='chatForm')ask(e.target.querySelector('input[name="q"]').value);
 else if(e.target.id==='demandForm'){
 const d=state.draft;d.title=d.title.trim();d.desc=d.desc.trim();
 if(!d.title||!d.desc||!d.agree){$('#formError').textContent='请填写主题、具体需求，并确认服务范围。';return}
 if(isCase(d.title+' '+d.desc)||/1[3-9]\d{9}|\d{17}[\dXx]|银行卡|身份证/.test(d.title+' '+d.desc)){$('#caseDialog').showModal();return}
 records.unshift({type:d.type,title:d.title,desc:d.desc,date:new Date().toLocaleDateString('zh-CN'),id:Date.now()});records=records.slice(0,30);
 try{localStorage.setItem(STORAGE,JSON.stringify(records))}catch{toast('浏览器未允许本地存储，刷新后记录将消失')}
 state.draft={type:'普法问题',title:'',desc:'',agree:false};go('success');
 }
});
for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});

render();
</script>
</body>
</html>
