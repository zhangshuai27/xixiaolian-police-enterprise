d"><span>普法问题</span><span>培训需求</span><span>资料建议</span></div></div><div class="card"><h3>会员端同步预览</h3><p>选中需求后，可查看企业收到的状态与反馈。</p><div id="memberPreview"></div><button class="secondary" data-page="member">打开会员视角</button></div></aside></div></div><div class="toast" id="toast" role="status"></div>
<script>
const initial=[{id:1,type:'普法问题',title:'采购与付款由同一岗位负责，如何完善内部防范？',company:'北京启禾科技有限公司（示例）',desc:'我们希望了解企业采购、验收、付款之间如何分工，以及日常自查可以重点关注哪些环节。希望获得适合中小企业使用的管理清单。',date:'2026-10-15 09:36',status:'待处理',reply:'',logs:[]},{id:2,type:'培训需求',title:'希望开展合同交易风险专题培训',company:'北京景和商贸有限公司（示例）',desc:'希望面向企业负责人、采购及财务岗位开展一次合同交易风险培训，重点讲解签约核验和履约过程的风险防范。预计约30人，时间可协商。',date:'2026-10-14 15:20',status:'处理中',reply:'已收到培训需求，正在汇总相近主题。具体安排确定后，将在这里反馈。',logs:[{text:'已开始跟进，并向企业反馈需求汇总进展。',date:'2026-10-15 09:00',public:true}]},{id:3,type:'资料建议',title:'建议提供企业防范非法集资宣传资料',company:'北京澄远服务有限公司（示例）',desc:'希望提供适合企业内部转发的图文或宣传手册，帮助员工识别高收益承诺等常见风险。',date:'2026-10-13 11:08',status:'已反馈',reply:'已记录您的资料建议，将纳入后续普法资料选题。目前可先通过服务站“常见咨询”了解高收益承诺相关的防范知识。',logs:[{text:'已反馈资料选题安排。',date:'2026-10-14 16:30',public:true}]}];
const key='xixiaolian-jingzhen-prototype-v1';let requests;try{requests=JSON.parse(localStorage.getItem(key))}catch{}if(!Array.isArray(requests)||!requests.length)requests=structuredClone(initial);let page='home',selected=1,role='police',type='全部',status='全部',query='';const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=()=>requests.find(r=>r.id===selected)||requests[0];function save(){localStorage.setItem(key,JSON.stringify(requests))}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',2600)}function go(p){page=p;render();$('#screen').scrollTop=0}function summary(){return `<div class="countrow">${[['待处理','待处理'],['处理中','跟进中'],['已反馈','已反馈']].map(([s,n])=>`<div><b>${requests.filter(r=>r.status===s).length}</b><span>${n}</span></div>`).join('')}</div>`}function memberCard(r){return `<div class="member"><div class="row"><span class="tag">${esc(r.type)}</span><span class="tag">${r.status==='待处理'?'已提交':r.status==='处理中'?'处理中':'已反馈'}</span></div><strong style="margin:9px 0">${esc(r.title)}</strong><p>${r.reply?esc(r.reply):(r.status==='处理中'?'西城经侦已开始处理您的需求，后续进展将在这里反馈。':'您的需求已提交至西城经侦，等待工作人员查看。')}</p><p style="margin-top:8px;color:#9aa6b5">服务机构：西城经侦</p></div>`}function home(){return `<div class="reference-home"><img src="assets/jingzhen-home-reference.png" alt="西小联首页：小联帮你链、小联为你办、小联引外源、今日待办、会员活动、我的档案"><button class="home-hit hit-external" data-page="list" aria-label="小联引外源"></button><button class="home-hit hit-task" data-page="list" aria-label="查看小联引外源待办"></button><button class="home-hit hit-bell" data-action="pending" aria-label="消息提醒"></button><button class="home-hit hit-chain" data-action="unavailable" aria-label="小联帮你链"></button><button class="home-hit hit-work" data-action="unavailable" aria-label="小联为你办"></button><button class="home-hit hit-activity" data-action="unavailable" aria-label="会员活动"></button><button class="home-hit hit-files" data-action="unavailable" aria-label="我的档案"></button><span class="home-count">${requests.filter(r=>r.status!=='已反馈').length}</span></div>`}function list(){return `<div class="banner"><div class="row"><b>警企服务需求</b><span style="font-size:11px">西城经侦</span></div></div><div class="stats">${summary()}</div><div class="tabs">${['全部','待处理','处理中','已反馈'].map(s=>`<button class="${status===s?'on':''}" data-status="${s}">${s}</button>`).join('')}</div><input class="search" id="search" aria-label="搜索需求" placeholder="⌕ 搜索标题或上报单位" value="${esc(query)}"><div class="chips">${['全部','普法问题','培训需求','资料建议'].map(t=>`<button class="${type===t?'on':''}" data-type="${t}">${t}</button>`).join('')}</div><div id="results">${cards()}</div>`}function cards(){let rows=requests.filter(r=>(type==='全部'||r.type===type)&&(status==='全部'||r.status===status)&&(r.title+r.company).includes(query));return rows.map(r=>`<button class="request" data-id="${r.id}"><div class="row"><span class="tag">${esc(r.type)}</span><span class="tag ${r.status==='待处理'?'warm':''}">${r.status}</span></div><h3>${esc(r.title)}</h3><p>${esc(r.desc.slice(0,46))}…</p><p style="margin-top:6px">上报单位：${esc(r.company)}</p><footer><span>提交时间：${r.date}</span><span style="color:#5987c7">查看详情 ›</span></footer></button>`).join('')||'<div class="empty">没有符合条件的需求</div>'}function detail(){let r=current();return `<div class="row" style="margin-top:12px"><span class="tag">${r.type}</span><span class="tag">${r.status}</span></div><h2 class="detail-title">${esc(r.title)}</h2><p class="sub">编号 JQ202610${String(r.id).padStart(4,'0')} · ${r.date}</p><section class="card"><h3>企业提交内容</h3><p style="margin:12px 0;font-size:13px">${esc(r.desc)}</p><p class="sub">上报单位：${esc(r.company)}<br>接收机构：西城经侦<br>来源：警企服务站 → 企业出题</p></section><section class="card"><h3>处理记录</h3><div class="timeline"><div class="event"><p>企业提交需求</p><small>${r.date}</small></div>${r.logs.map(l=>`<div class="event"><p>${esc(l.text)}</p><small>${esc(l.date)} · ${l.public?'已同步企业':'内部记录'}</small></div>`).join('')}</div></section>${`<section class="card"><h3>${r.status==='待处理'?'接收并处理':'继续跟进'}</h3>${r.status==='待处理'?'<p class="notice">开始处理后，企业可在“我的出题”看到处理中状态。</p><button class="primary" data-action="accept">开始处理</button>':''}<div class="field"><label for="reply">向企业反馈</label><textarea id="reply" maxlength="500" placeholder="说明已解答的内容、选题进展或培训安排。请填写可向企业展示的内容。">${esc(r.reply)}</textarea></div><div class="field"><label for="nextStatus">反馈后的状态</label><select id="nextStatus"><option value="处理中" ${r.status!=='已反馈'?'selected':''}>处理中 · 后续继续跟进</option><option value="已反馈" ${r.status==='已反馈'?'selected':''}>已反馈 · 本次回应完成</option></select></div><p class="notice">反馈文字和状态将同步至会员端“我的出题”。</p><button class="primary" data-action="reply">确认并发送反馈</button></section>`}<p class="notice">本流程用于普法服务需求处理，不代表报案、受案或立案。</p>`}function member(){return `<div class="card"><h3>我的出题 <span class="sub">· 会员端预览</span></h3><p class="notice">选择一条记录，查看同步到企业的状态和反馈。</p><div class="field"><label for="memberSelect">选择需求</label><select id="memberSelect">${requests.map(r=>`<option value="${r.id}" ${r.id===selected?'selected':''}>${esc(r.title)}</option>`).join('')}</select></div>${memberCard(current())}<div class="timeline"><div class="event"><p>提交成功</p><small>${current().date}</small></div>${current().logs.filter(l=>l.public).map(l=>`<div class="event"><p>${esc(l.text)}</p><small>${esc(l.date)}</small></div>`).join('')}</div></div><button class="secondary" data-page="detail">返回工作端查看这条需求</button><p class="notice">在此查看需求状态和西城经侦的反馈。</p>`}function render(){let titles={home:'西城经侦',list:'警企服务需求',detail:'需求详情',member:'我的出题'};$('#navTitle').textContent=titles[page];document.querySelector('.phone').classList.toggle('home-mode',page==='home');$('#screen').innerHTML=({home,list,detail,member})[page]();$('#roleToggle').textContent=page==='member'?'经侦视角':'会员端视角';$('#roleNote').textContent='西城经侦负责查看本机构需求、开展普法解答、跟进培训与资料建议，并向企业反馈。';$('#memberPreview').innerHTML=memberCard(current());document.querySelectorAll('.step').forEach(e=>e.classList.toggle('active',e.dataset.page===page))}function now(){return new Date().toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'}).slice(0,16)}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.id){selected=Number(b.dataset.id);go('detail');return}if(b.dataset.status){status=b.dataset.status;render();return}if(b.dataset.type){type=b.dataset.type;render();return}let a=b.dataset.action,r=current();if(a==='unavailable'){toast('本次展示警企服务流程');return}if(a==='training'){type='培训需求';status='全部';go('list')}if(a==='pending'){status='待处理';type='全部';go('list')}if(a==='accept'&&role==='police'){r.status='处理中';r.logs.push({text:'西城经侦已开始处理。',date:now(),public:true});save();render();toast('已开始处理，会员端状态已同步')}if(a==='reply'&&role==='police'){let value=$('#reply').value.trim();if(!value){toast('请先填写向企业反馈的内容');$('#reply').focus();return}r.reply=value;r.status=$('#nextStatus').value;r.logs.push({text:value,date:now(),public:true});save();render();toast('演示反馈已发送，可查看会员端预览')}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#results').innerHTML=cards()}});document.addEventListener('change',e=>{if(e.target.id==='memberSelect'){selected=Number(e.target.value);render()}});$('#back').onclick=()=>go(page==='detail'?'list':'home');$('#roleToggle').onclick=()=>go(page==='member'?'home':'member');$('#reset').onclick=()=>{if(confirm('重置本页的演示需求和处理记录？不会修改真实业务数据。')){requests=structuredClone(initial);save();selected=1;go('home');toast('演示记录已重置')}};render();
