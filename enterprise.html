{id:'internal',type:'risk',tag:'内部管理',icon:'shield',title:'企业内部风险，从这几个环节开始防范',summary:'围绕采购、付款和岗位权限，关注日常管理中的风险信号。',blocks:[['从流程里识别风险','采购审批、资金支付、费用报销等环节，应留意职责过度集中、凭证不完整、审批流于形式等管理问题。这些信号用于提示进一步核查，不能直接作为犯罪认定。'],['把关键环节管起来','企业可结合实际建立岗位分工、复核与定期检查机制，明确审批权限和记录要求，减少单一岗位对业务全过程的控制。'],['发现具体问题时','如涉及具体经济犯罪案件，请通过线下正式渠道咨询。不要把涉案材料、人员身份信息或商业秘密上传到本栏目。']]},

{id:'case1',type:'cases',tag:'案例解读',icon:'case',title:'从采购管理情境，看企业内部防范要点',summary:'一个虚构的普法情境，帮助理解供应商审核与岗位制衡。',blocks:[['普法情境','某企业将供应商选择、采购确认与付款申请集中在同一岗位，复核环节较少。此处为产品演示编写的虚构情境，不是真实案件。'],['可以讨论的管理问题','企业如何核实供应商信息？不同岗位如何分工？付款申请和业务交付之间如何复核？这些问题可作为企业内部制度检查的切入点。'],['从情境到日常防范','可结合业务规模完善复核记录与权限管理。情境仅用于普法，不对任何人员或企业作犯罪判断。']]},

{id:'law1',type:'law',tag:'罪名知识',icon:'scale',title:'认识经济犯罪知识，从概念与边界开始',summary:'通过审核资料了解常见概念，避免把普法知识当作个案结论。',blocks:[['怎样使用法律知识栏目','正式上线后，这里将展示经审核的法条、罪名释义、适用说明和关联案例，并标明来源与更新信息。'],['一般知识与个案判断','普法资料帮助理解概念。具体事项是否符合有关条件，需要结合事实和证据依法判断。'],['演示范围','当前页面仅演示内容结构，不展示未经核验的法条文本、金额标准或量刑结论。']]}

{id:'internal',category:'内部管理',q:'企业内部风险如何防范？',summary:'采购、审批与付款环节，哪些地方要关注',answer:'可以从企业日常管理流程入手：明确采购、审批、付款等岗位的分工，保留业务凭证和复核记录，并定期检查关键岗位权限与异常业务。\n\n这些是一般防范思路，不能据此认定具体人员或事项是否涉嫌犯罪。',source:'internal'},
{id:'contract',category:'合同交易',q:'签订合同前，要注意哪些风险？',summary:'核实交易信息，关注履约安排',answer:'签约前可关注交易主体、人员授权、合同约定与实际安排是否一致，并按企业制度做好审批及履约记录。\n\n对异常信息应进一步核实，不能仅凭违约直接认定犯罪。',source:'contract'},

{id:'case-reading',category:'内部管理',q:'典型案例可以怎样帮助企业防范风险？',summary:'从案例中看管理环节，不直接套用个案结论',answer:'可以关注案例中的业务流程、管理缺口与防范措施，并结合企业实际检查内部制度。\n\n案例不能直接替代对具体事项的事实核查或专业判断。',source:'case1'},
{id:'contact',category:'服务指引',q:'经济犯罪案件相关问题，到哪里咨询？',summary:'查看属地派出所或西城经侦窗口指引',answer:GUIDE,guide:true},

function chat(conversation=state.messages){return `<div class="chat-intro"><div class="ask-face"><img src="assets/law-assistant.png" alt="小联说法务"></div><h2>${state.chatKind==='legal'?'小联说法务':'经侦知识问答'}</h2><p>您可以问一般知识，也可以查看相关资料</p></div><div class="chat-hint">AI问答演示 · 具体案件请线下咨询</div><div class="chat-area">${conversation.length?conversation.map(m=>`<div class="bubble ${m.role}">${m.role==='assistant'?'<label>小联 · 示例答复</label>':''}<p>${esc(m.text)}</p>${m.source?`<button class="chat-source" data-action="article" data-id="${m.source}">${icon('book')} 查看相关内容示例</button>`:''}${m.guide?'<button class="chat-source" data-action="guide">有事找谁 · 查看线下咨询指引 →</button>':''}${m.demand?'<button class="chat-source" data-action="leave">企业出题 · 提出普法需求 →</button>':''}</div>`).join(''):`<div class="bubble assistant"><label>小联 · 示例答复</label><p>您好！您想了解哪方面的风险防范知识？可以从下面的问题开始。</p></div><div class="chat-choices"><button data-action="ask" data-q="企业内部风险如何防范？">企业内部风险如何防范？</button><button data-action="ask" data-q="签合同前要注意什么？">签合同前要注意什么？</button><button data-action="ask" data-q="经济犯罪案件到哪里咨询？">经济犯罪案件到哪里咨询？</button></div>`}</div>`}
function isCase(q){return /报案|报警|立案|受案|案情|案件|证据|我.{0,8}被|我们.{0,8}被骗|涉嫌|是否.{0,5}犯罪|构成.{0,5}罪|算不算|追回|追赃|刑事还是民事/.test(q)}
const followupTopics={"internal": [["采购审批具体怎么做？", "可以把采购申请、供应商核验、审批和付款复核列成流程清单，明确每一步的负责人与留存记录。这里展示的是一般管理思路。"], ["如何开展日常自查？", "围绕刚才的内部管理主题，可以从岗位权限、审批记录、付款复核三项开始，逐项记录检查结果和待完善事项。"]], "contract": [["签约前先核查哪些信息？", "沿着合同风险这个主题，可以先核对交易主体、签约人员授权以及合同约定与实际业务是否一致，并记录核查结果。"], ["付款环节如何复核？", "接着刚才的合同主题，付款前可按企业制度复核合同、收款信息、审批记录及履约安排；有不一致的情况时先进一步核实。"]], "investment": [["高收益承诺有哪些关注点？", "接着刚才的主题，可以关注收益来源是否清楚、资金安排是否透明，以及对方能否清晰解释风险。演示内容不对具体投资作出判断。"], ["企业内部如何复核？", "可以整理项目说明、资金安排和风险信息，交由企业相应岗位按制度复核；遇到信息缺失时，先补充核实。"]], "case-reading": [["看案例时重点看什么？", "可沿着业务经过、管理缺口、防范措施三个方面阅读案例，把可借鉴的管理做法记录下来。"], ["怎样用于企业自查？", "可以将案例涉及的管理环节对应到企业现有流程，记录相似环节和待完善制度；不要将案例结论直接套用到具体事项。"]], "contact": [["可以去哪里咨询？", "如您想咨询经济犯罪案件相关的问题，可以就近到属地派出所咨询，或到西城公安分局经济犯罪侦查支队受案中心前台咨询（联系电话63565726）。"], ["能在这里提交材料吗？", "本页面不接收案情、证据或案件材料。具体事项请通过刚才提供的线下渠道咨询。"]], "training": [["培训需求需要写什么？", "沿着刚才的培训需求，您可以写清希望了解的主题、面向哪些岗位，以及希望采用的普法形式。请勿填写具体案情或上传案件材料。"], ["提交后会如何处理？", "工作人员可定期汇总共性需求，择题进行普法答疑或安排培训。提交不代表预约成功，也不承诺逐条即时回复。"]]};
function topicOf(q){return /培训|出题|普法需求/.test(q)?'training':/合同|签约|付款/.test(q)?'contract':/内部|采购|员工|自查/.test(q)?'internal':/投资|高收益|金融/.test(q)?'investment':/案例/.test(q)?'case-reading':/窗口|咨询渠道|去哪里咨询/.test(q)?'contact':null}
function followupButtons(m){return m.topic&&followupTopics[m.topic]?`<div class="followup-options"><span>继续追问</span>${followupTopics[m.topic].map(([q])=>`<button data-action="followup" data-topic="${m.topic}" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`:''}
function ask(q,kind='station',explicitTopic=null){
 q=q.trim();if(!q)return;if(kind==='legal'){askLegal(q);return}
 const inFaq=state.page==='faq';const conversation=inFaq?state.faqMessages:state.messages;const matched=faqs.find(f=>f.q===q);const previous=[...conversation].reverse().find(x=>x.role==='assistant'&&x.topic);const topic=explicitTopic||(matched&&matched.id)||topicOf(q)||(previous&&previous.topic);const choices=followupTopics[topic]||[];const followup=choices.find(([question])=>question===q);state.chatKind='station';state.chatInput='';conversation.push({role:'user',text:q});let m={role:'assistant',text:'',topic};
 if(matched){m.text=matched.answer;m.source=matched.source;m.guide=matched.guide;m.demand=matched.demand}
 else if(isCase(q)){m.text='具体事项需要通过正式渠道，由专业人员结合事实和证据了解。\n\n'+GUIDE+'\n\n请勿在这里提交案情或案件材料。';m.guide=true}
 else if(followup){m.text=followup[1]}
 else if(topic&&/具体|怎么做|如何做|然后|接下来|还有|详细|展开|举例|需要什么|哪些信息|准备什么/.test(q)){const n=conversation.filter(x=>x.role==='assistant'&&x.topic===topic).length;m.text=choices[Math.max(0,n-1)%choices.length][1]}
 else if(/培训|想听|出题/.test(q)){m.text=faqs.find(f=>f.id==='training').answer;m.demand=true}
 else if(/高收益|金融|投资/.test(q)){m.text=faqs.find(f=>f.id==='investment').answer;m.source='investment'}
 else if(/内部|职务|采购|员工|侵占/.test(q)){m.text=faqs.find(f=>f.id==='internal').answer;m.source='internal'}
 else if(/合同|交易|签约/.test(q)){m.text=faqs.find(f=>f.id==='contract').answer;m.source='contract'}
 else if(/典型案例|案例.{0,6}防范/.test(q)){m.text=faqs.find(f=>f.id==='case-reading').answer;m.source='case1'}
 else{m.text=topic?'您可以继续围绕刚才的问题提问。当前演示暂未覆盖这条追问的具体内容，可以先点选下方相关问题。':'当前演示资料暂未覆盖这个问题。您可以查看常见咨询，或通过企业出题提出希望了解的普法主题。';m.demand=true}
 conversation.push(m);if(inFaq){state.faqConversation=true;render()}else{go('chat',{chatKind:'station'})}requestAnimationFrame(()=>{const scroller=$('#serviceContent');const question=inFaq?scroller.querySelector('.faq-message.user:nth-last-child(2)'):null;if(question)scroller.scrollTo({top:scroller.scrollTop+question.getBoundingClientRect().top-scroller.getBoundingClientRect().top-12,behavior:'smooth'});else scroller.scrollTop=scroller.scrollHeight})
}
function askLegal(q){q=q.trim();if(!q)return;state.legalMode='chat';state.legalMessages.push({role:'user',text:q});state.legalMessages.push({role:'assistant',text:'这里是小联说法务的法律知识问答入口。当前原型未接入原有法务知识库，暂不生成个案建议。\n\n如希望了解经侦风险防范知识，可返回西小联首页进入独立的警企服务站。'});renderLegal();document.body.classList.remove('mobile-service');}

 document.body.classList.remove('approved-external');if(state.page==='externalServices')document.body.classList.add('approved-external');

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='external'){state.history=[];go('externalServices',{},false)}
 else if(a==='externalStation')go('home');
 else if(a==='comingSoon')$('#comingSoonDialog').showModal();
 else if(a==='closeComingSoon')$('#comingSoonDialog').close();
 else if(a==='pending')toast('该服务正在规划，暂未接入演示');
 else if(a==='enter'){state.history=[];go('home',{},false)}
 else if(a==='back')back();
 else if(a==='home'){state.history=[];go('home',{},false)}
 else if(a==='faq')go('faq',{faqQuery:'',faqCategory:'全部',faqConversation:false});
 else if(a==='followup')ask(b.dataset.q,'station',b.dataset.topic);
 else if(a==='faqAsk'){const f=faqs.find(x=>x.id===b.dataset.id);if(f)ask(f.q)}
 else if(a==='faqList'){state.faqConversation=false;render();$('#serviceContent').scrollTop=0}
 else if(a==='faqCategory'){state.faqCategory=b.dataset.category;render()}
 else if(a==='faqDetail')go('faqDetail',{faqId:b.dataset.id});
 else if(a==='library')go('library',{tab:b.dataset.tab||'risk',search:''});
 else if(a==='tab'){state.tab=b.dataset.tab;render()}
 else if(a==='article')go('article',{article:b.dataset.id});
 else if(a==='chat')go('chat',{chatKind:'station'});
 else if(a==='ask')ask(b.dataset.q);
 else if(a==='legalQuestion')askLegal(b.dataset.q);
 else if(a==='legalCases'){state.legalMode='cases';renderLegal()}
 else if(['leave','messages','guide'].includes(a))go(a);
 else if(a==='training'){state.draft.type='培训需求';go('leave')}
 else if(a==='returnLegal'){state.page='home';state.history=[];state.legalMode='home';render();showLegal();}
 else if(a==='legalBack'){if(state.legalMode!=='home'){state.legalMode='home';renderLegal()}else showPortal()}
 else if(a==='demandType'){state.draft.type=b.dataset.type;render()}

 else if(a==='reset'){records=[];state.messages=[];state.faqMessages=[];state.faqConversation=false;state.legalMessages=[];state.chatInput='';state.legalMode='home';state.draft={type:'普法问题',title:'',desc:'',agree:false};try{localStorage.removeItem(STORAGE)}catch{}state.history=[];renderLegal();go('home',{},false);toast('已清空本浏览器的演示记录')}
});

function intakeSet(){return intakeData.find(d=>d.id===intake.dataset)}
function includesAnswer(a,id,keys){return (a[id]||[]).some(k=>keys.includes(k))}
function activeQuestions(d,a){
 return d.questions.filter(q=>{
  const id=q.id,c=d.crime,has=(key,values)=>includesAnswer(a,key,values);
  if(c===1&&id==='9')return false; // Contract kind is chosen before entering its questionnaire.
  if(c===2){if(has('5',['E'])&&Number(id.split('-')[0])>5)return false;if(id==='6-1')return has('5',['A','B','C']);if(id==='6-2')return has('5',['D']);if(id.startsWith('9-'))return has('5',[id.split('-')[1].toUpperCase()]);}
  if(c===6&&id.startsWith('7-'))return id.startsWith('7-1')?has('3',['A']):has('3',['B'])&&!has('3',['A']);
  if(c===5&&['12','13','14'].includes(id))return has('11',['A']);
  if(c===4&&id==='15')return has('14',['B','C','D','E']);
  if(c===9&&id==='14')return has('13',['B','C','D','E']);
  if(c===9&&id==='16')return has('15',['A','B']);
  if(c===8&&['9','10'].includes(id)&&has('8',['A']))return false;
  if(c===11&&id==='11')return has('10',['A','B','C','D']);
  if(c===12&&id==='10')return has('9',['A','B','C','D']);
  if(c===12&&id.startsWith('6-'))return id.startsWith('6-a')?has('6',['A','C']):has('6',['B','C']);
  const branch=id.match(/^(\d+)-([a-z])/);if(branch)return has(branch[1],[branch[2].toUpperCase()]);
  if(/具体.*北京.*(?:区|区域)/.test(q.text)){const prev=d.questions.find(x=>x.id===String(Number(id)-1));if(prev){const selected=a[prev.id]||[];return selected.some(k=>k!=='U'&&!/均不在/.test(prev.options.find(o=>o.key===k)?.label||''));}}
  return true;
 });
}

function reportReview(){const d=intakeSet(),list=activeQuestions(d,intake.answers);return `<div class="page-intro"><h2>核对填写内容</h2><p>${esc(d.name)} · 仅汇总当前分支答案</p></div><div class="form-block"><p>相关日期：${esc(intake.date||'未填写')}</p><p>涉及金额：${intake.amount?esc(intake.amount)+' 元':'未填写'}</p><button class="text-btn" data-action="editInfo">修改基本信息</button></div>${list.map((q,i)=>`<div class="review-row"><strong>${esc(q.text)}</strong><p>${esc(answerText(q)||'未填写')}</p><button class="text-btn" data-action="editAnswer" data-index="${i}">修改</button></div>`).join('')}<button class="primary" data-action="generateReport">生成报案准备指引</button>`}
function reportParts(){const d=intakeSet(),list=activeQuestions(d,intake.answers);const material=list.filter(q=>/哪些材料|可提供|持有.*情况/.test(q.text));const unresolved=list.filter(q=>(intake.answers[q.id]||[]).includes('U')||/无证据|无法提供|不清楚|未核实/.test(answerText(q)));return {d,list,material,unresolved}}
function reportResult(){const {d,list,material,unresolved}=reportParts();return `<article class="report-sheet" id="generatedReport"><div class="report-stamp">线下咨询参考 · 评审版</div><h2>报案准备指引</h2><p class="report-sub">${esc(d.name)}</p><p class="intake-notice">本指引根据您自行填写的信息生成，未经核实，不判断是否构成犯罪、是否达到立案条件或应由哪个机关受理。</p><h3>一、您填写的基本信息</h3><p>相关日期：${esc(intake.date||'未填写')}<br>涉及金额：${intake.amount?esc(intake.amount)+' 元':'未填写'}<br>已完成当前路径 ${list.length} 项问答。</p><h3>二、建议线下进一步说明的事项</h3>${unresolved.length?`<ul>${unresolved.map(q=>`<li>${esc(q.text)}<small>您选择：${esc(answerText(q))}</small></li>`).join('')}</ul>`:'<p>当前问答没有标记不清楚的事项。该状态仅表示填写情况，不代表材料完整或符合立案要求。</p>'}<h3>三、材料准备清单</h3><p>请自行准备身份或授权材料、事情经过说明，以及下列问卷涉及的材料。此处只记录持有情况，不接收材料上传。</p>${material.length?material.map(q=>`<div class="report-material"><strong>${esc(q.text)}</strong><p>您选择：${esc(answerText(q))}</p></div>`).join(''):'<p>当前分支未涉及具体材料选择，可携现有相关材料到线下咨询。</p>'}<h3>四、完整问答记录</h3>${list.map(q=>`<div class="report-answer"><strong>${esc(q.text)}</strong><p>${esc(answerText(q))}</p></div>`).join('')}<h3>五、线下咨询渠道</h3><p>${GUIDE}</p><p>前往前请确认最新接待地点与时间。</p><h3>六、资料与结论说明</h3><p class="source-path">${esc(d.source)}</p><p>问卷来自提供的2023—2024年资料。对应报告含“50分以上／以下”等版本，但有效评分表缺失，分数等于50时的规则也待确认。本版本不计算分数、不自动套用涉嫌犯罪或经济纠纷结论。模板结论、数额标准及法律依据须经经侦复核后启用。</p></article><div class="intake-actions"><button class="secondary" data-action="reviewAgain">修改答案</button><button class="primary" data-action="downloadReport">下载指引</button></div><button class="secondary" data-action="restartIntake">重新选择罪名</button>`}
function reportAudit(){return `<div class="page-intro"><h2>资料核对</h2><p>1期、2期各6个罪名 · 原型评审依据</p></div><div class="form-block"><h3>已嵌入</h3><p>12个罪名、18份问卷，共347个问题节点（含重复公共题与分支题）；合同诈骗包含7类合同。单选、多选、分支追问、返回修改及报告下载已实现。</p></div><div class="form-block"><h3>报告处理</h3><p>29份原报告按“基本情况、罪名介绍、案件分析、材料建议、特别提示”等组织，含高低分和特殊结果版本。当前采用问答摘要、待说明事项、材料清单及线下渠道作为可评审报告，未自动输出原模板中的犯罪结论。</p></div><div class="form-block"><h3>需业务确认</h3><ol><li>正式名称暂沿用“警企服务站”。</li><li>补齐评分标准：压缩包仅有2份165字节的“~$”Excel临时文件。</li><li>信用卡第5题E写“结束”，第7题又写“无论选哪个均需回答”；暂按结束处理。</li><li>部分问卷未明确多选，材料类问题按多选演示；跨地区跳过北京区县题、未知选项为产品补充。</li><li>部分报告题号、选项引用与问卷不一致，需统一版本；日期、金额补录为新增产品字段。</li><li>复核2023—2024年资料中的数额标准、法律依据与报告用途。</li></ol></div>${crimeNames.map((n,i)=>`<details class="review-row"><summary>${esc(n)}</summary>${intakeData.filter(d=>d.crime===i+1).map(d=>`<p class="source-path">${esc(d.source)} · ${d.questions.length}题</p>`).join('')}</details>`).join('')}`}
function saveInfo(){const date=$('#incidentDate'),amount=$('#incidentAmount');if(amount&&!amount.checkValidity()){amount.reportValidity();return false}intake.date=date?.value||'';intake.amount=amount?.value||'';return true}
document.addEventListener('change',e=>{
 if(e.target.name!=='intakeOption')return;
 const q=currentQuestion(),old=intake.answers[q.id]||[],key=e.target.value;
 let next=q.multi?(e.target.checked?[...old.filter(k=>k!==key),key]:old.filter(k=>k!==key)):[key];
 const exclusive=k=>k==='U'||/无证据|均不|无上述|无任何|未做出任何|上述情形均/.test(q.options.find(o=>o.key===k)?.label||'');
 if(e.target.checked){if(exclusive(key))next=[key];else next=next.filter(k=>!exclusive(k));}
 const d=intakeSet(),order=d.questions.findIndex(x=>x.id===q.id);for(const tail of d.questions.slice(order+1))delete intake.answers[tail.id];intake.answers[q.id]=next;
 const scroll=$('#serviceContent').scrollTop;render();$('#serviceContent').scrollTop=scroll;
});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='portal')showPortal();
 else if(a==='openLegal')showLegal();
 else if(a==='intake')go('reportSelect');
 else if(a==='audit')go('reportAudit');
 else if(a==='toggleCrime'){crimeDropdownOpen=!crimeDropdownOpen;render()}
 else if(a==='selectCrime'){crimeSelection=Number(b.dataset.crime);crimeDropdownOpen=false;render()}
 else if(a==='startCrime'){if(!crimeSelection)return;if(crimeSelection===1)go('reportVariants');else startIntake(intakeData.find(d=>d.crime===crimeSelection).id)}
 else if(a==='chooseCrime'){const c=Number(b.dataset.crime);if(c===1)go('reportVariants');else startIntake(intakeData.find(d=>d.crime===c).id)}
 else if(a==='chooseDataset')startIntake(b.dataset.id);
 else if(a==='beginQuestions'){if(saveInfo())go('reportQuestions')}
 else if(a==='intakeResume')go('reportQuestions');
 else if(a==='previousQuestion'){if(intake.index){intake.index--;render();$('#serviceContent').scrollTop=0}else go('reportInfo')}
 else if(a==='nextQuestion'){const q=currentQuestion();if(!intake.answers[q.id]?.length){toast('请选择一项，或选择暂不清楚');return}const list=activeQuestions(intakeSet(),intake.answers);if(intake.index===list.length-1)go('reportReview');else{intake.index++;render();$('#serviceContent').scrollTop=0}}
 else if(a==='editAnswer'){intake.index=Number(b.dataset.index);go('reportQuestions')}
 else if(a==='editInfo')go('reportInfo');
 else if(a==='generateReport'){if(activeQuestions(intakeSet(),intake.answers).some(q=>!intake.answers[q.id]?.length)){toast('请先补充当前路径未回答的问题');return}go('reportResult')}
 else if(a==='reviewAgain')go('reportReview');
 else if(a==='restartIntake')go('reportSelect');
 else if(a==='downloadReport'){const text=$('#generatedReport').innerText;const url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=intakeSet().name+'-报案准备指引.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已生成下载文件，请在线下咨询时参考')}
});

render();
</script>
<dialog id="comingSoonDialog" class="coming-soon-dialog" aria-labelledby="comingSoonTitle"><h2 id="comingSoonTitle">敬请期待</h2><button data-action="closeComingSoon">我知道了</button></dialog><script src="demand-flow.js?v=20261021"></script>
</body>
